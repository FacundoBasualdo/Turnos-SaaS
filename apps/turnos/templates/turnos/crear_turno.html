<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Turno - {{ tenant.nombre_negocio }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-md">
        <h2 class="text-xl font-bold text-slate-900 mb-6">Agendar Nuevo Turno</h2>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Seleccionar Paciente</label>
                <div class="flex gap-2">
                    <select id="select-cliente" name="cliente_id" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option value="">-- Seleccione un paciente --</option>
                        {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">{{ cliente.apellido }}, {{ cliente.nombre }}</option>
                        {% endfor %}
                    </select>
                    <button type="button" onclick="abrirModalCliente()" class="bg-slate-100 border border-slate-300 text-slate-700 px-3 py-2 rounded-lg hover:bg-slate-200 font-medium text-sm whitespace-nowrap">
                        + Nuevo
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Fecha y Hora</label>
                <input type="datetime-local" name="fecha_hora" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Motivo / Descripción</label>
                <textarea name="descripcion" rows="3" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
            </div>
            <div class="flex justify-end gap-3 pt-4">
                <a href="{% url 'dashboard_profesional' %}" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</a>
                <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Agendar Turno</button>
            </div>
        </form>
    </div>

    <div id="modalCliente" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-lg border border-slate-200 w-full max-w-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-900">Crear Nuevo Paciente</h3>
                <button type="button" onclick="cerrarModalCliente()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
            </div>
            <form id="formCrearClienteRapido" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nombre</label>
                    <input type="text" name="nombre" placeholder="Ej. Juan" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Apellido</label>
                    <input type="text" name="apellido" placeholder="Ej. Pérez" required class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Teléfono</label>
                    <input type="text" name="telefono" placeholder="Ej. 3415555555" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
                    <input type="email" name="correo" placeholder="correo@ejemplo.com" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="cerrarModalCliente()" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm">Cancelar</button>
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 text-sm">Guardar Paciente</button>
                </div>
            </form>
        </div>
    </div>


    <script>
        function abrirModalCliente() {
            document.getElementById('modalCliente').classList.remove('hidden');
        }

        function cerrarModalCliente() {
            document.getElementById('modalCliente').classList.add('hidden');
            document.getElementById('formCrearClienteRapido').reset();
        }

        document.getElementById('formCrearClienteRapido').addEventListener('submit', function(e) {
            e.preventDefault();
            let formData = new FormData(this);

            fetch("{% url 'crear_cliente_ajax' %}", {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    let select = document.getElementById('select-cliente');
                    let nuevaOption = new Option(data.cliente_texto, data.cliente_id, true, true);
                    select.add(nuevaOption);
                    select.value = data.cliente_id;
                    cerrarModalCliente();
                } else {
                    alert('Error al guardar el paciente.');
                }
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
